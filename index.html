<!DOCTYPE html>
<html>
<head>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
background:#000000;
color:#f5f5f7;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans‑serif;
padding:60px 20px;
/*苹果丝滑缓动入场*/
animation: pageShow 1.2s cubic‑bezier(0.2,0,0.2,1);
}
@keyframes pageShow{
0%{opacity:0;transform:translateY(24px);}
100%{opacity:1;transform:translateY(0);}
}
.box{
width:620px;
margin:0 auto;
}
.top{
display:flex;
align-items:flex‑start;
gap:32px;
margin-bottom:60px;
}
.top-text{
font-size:20px;
line-height:1.9;
letter‑spacing:0.3px;
opacity:0.94;
}
.small-top{
width:180px;
height:125px;
overflow:hidden;
border‑radius:14px;
transition:0.6s cubic‑bezier(0.2,0,0.2,1);
}
/*苹果式悬浮：只上浮，几乎不放大，没有爆炸亮光*/
.small-top:hover{
transform:translateY(-4px);
}
.small-top img{
width:100%;
height:100%;
object‑fit:cover;
display:block;
}
.bottom-wrap{
display:flex;
gap:32px;
}
.left-col{
width:48%;
}
.big1{
width:100%;
overflow:hidden;
margin-bottom:30px;
border‑radius:14px;
transition:0.6s cubic‑bezier(0.2,0,0.2,1);
}
.big1:hover{
transform:translateY(-4px);
}
.big1 img{
width:100%;
height:auto;
display:block;
}
.big2{
width:100%;
overflow:hidden;
border‑radius:14px;
transition:0.6s cubic‑bezier(0.2,0,0.2,1);
}
.big2:hover{
transform:translateY(-4px);
}
.big2 img{
width:100%;
height:auto;
display:block;
}
.right-col{
width:48%;
}
.right-img{
width:85%;
height:440px;
background:#111113;
margin:0 auto;
border‑radius:14px;
transition:0.6s cubic‑bezier(0.2,0,0.2,1);
}
.right-img:hover{
transform:translateY(-4px);
}
.bottom-text{
margin‑top:70px;
font‑size:16px;
line‑height:2;
text‑align:center;
opacity:0.72;
letter‑spacing:0.5px;
animation:textFadeUp 1.6s cubic‑bezier(0.2,0,0.2,1);
}
@keyframes textFadeUp{
0%{opacity:0;transform:translateY(30px);}
100%{opacity:0.72;transform:translateY(0);}
}
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <div class="top-text">
地图龟<br>
学名：Graptemys geographica<br>
泽龟科、地图龟属爬行动物<br>
取名：鱼仔
    </div>
    <div class="small-top">
<img src="https://tizzy-090131.github.io/fish.jpg">
    </div>
  </div>
  <div class="bottom-wrap">
    <div class="left-col">
      <div class="big1">
<img src="https://tizzy-090131.github.io/01.jpg">
      </div>
      <div class="big2">
<img src="https://tizzy-090131.github.io/02.jpg">
      </div>
    </div>
    <div class="right-col">
      <div class="right-img">右侧偏小图</div>
    </div>
  </div>
  <div class="bottom-text">
感谢您选择我们<br>
让每只龟都有属于自己的家<br>
Thank you for choosing us.<br>
Let every turtle have its own home.
  </div>
</div>
</body>
</html>
