<!DOCTYPE html>
<html>
<head>
<style>
.box{width:600px;margin:20px auto;}
.top{display:flex;align-items:flex-start;gap:14px;margin-bottom:10px;}
.top-text{font-size:18px;line-height:1.6;}
.small-top{width:180px;height:125px;background:#eee;}
.name{font-size:17px;margin:6px 0 16px 0;}

/*下面左右分两半*/
.bottom-wrap{display:flex;gap:15px;}
.left-col{width:48%;}
.big1{width:100%;height:160px;background:#f5f5f5;margin-bottom:15px;}
.big2{width:100%;height:320px;background:#f5f5f5;}

.right-col{width:48%;}
.right-img{width:85%;height:440px;background:#ddd;margin:0 auto;}
</style>
</head>
<body>
<div class="box">
  <div class="top">
    <div class="top-text">
地图龟<br>
学名：Graptemys geographica<br>
泽龟科、地图龟属爬行动物
    </div>
    <div class="small-top">右上角小图</div>
  </div>

  <div class="name">取名：鱼仔</div>

  <div class="bottom-wrap">
    <div class="left-col">
      <div class="big1">左第一张（短）</div>
      <div class="big2">左第二张大图</div>
    </div>
    <div class="right-col">
      <div class="right-img">右侧单独小一点的图</div>
    </div>
  </div>
</div>
</body>
</html>
